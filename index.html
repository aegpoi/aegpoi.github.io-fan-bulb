```
<header>
    <h1>HTML File Browser</h1>
    <p>Select a folder to browse its HTML files</p>
</header>

<div class="controls">

    <label for="folderInput" class="choose-button">
        📁 Select Folder
    </label>

    <input
        type="file"
        id="folderInput"
        webkitdirectory
        directory
        multiple
    >

    <input
        type="text"
        id="search"
        placeholder="🔎 Search HTML files..."
    >

    <div id="fileCount">
        No folder selected.
    </div>

</div>

<div id="fileList"></div>

<div id="emptyMessage">
    Select a folder to see its HTML files.
</div>


<script>

    const folderInput = document.getElementById("folderInput");
    const search = document.getElementById("search");
    const fileList = document.getElementById("fileList");
    const fileCount = document.getElementById("fileCount");
    const emptyMessage = document.getElementById("emptyMessage");

    let htmlFiles = [];


    // When the user selects a folder
    folderInput.addEventListener("change", function () {

        htmlFiles = [];

        // Get every file from the selected folder
        for (const file of folderInput.files) {

            // Only keep HTML files
            if (
                file.name.toLowerCase().endsWith(".html") ||
                file.name.toLowerCase().endsWith(".htm")
            ) {
                htmlFiles.push(file);
            }
        }

        // Sort alphabetically
        htmlFiles.sort((a, b) =>
            a.webkitRelativePath.localeCompare(b.webkitRelativePath)
        );

        displayFiles();
    });


    // Search when typing
    search.addEventListener("input", function () {
        displayFiles();
    });


    function displayFiles() {

        fileList.innerHTML = "";

        const searchText = search.value.toLowerCase();

        // Filter files based on search
        const filteredFiles = htmlFiles.filter(file =>
            file.name.toLowerCase().includes(searchText) ||
            file.webkitRelativePath.toLowerCase().includes(searchText)
        );


        fileCount.textContent =
            `${filteredFiles.length} of ${htmlFiles.length} HTML files`;


        if (filteredFiles.length === 0) {

            emptyMessage.textContent = searchText
                ? "No HTML files match your search."
                : "No HTML files found in this folder.";

            emptyMessage.style.display = "block";

            return;
        }


        emptyMessage.style.display = "none";


        // Create a link for every file
        for (const file of filteredFiles) {

            const link = document.createElement("a");

            link.className = "file";

            link.href = URL.createObjectURL(file);

            link.target = "_blank";

            link.rel = "noopener noreferrer";


            const name = document.createElement("div");

            name.className = "file-name";

            name.textContent = "📄 " + file.name;


            const path = document.createElement("div");

            path.className = "file-path";

            path.textContent = file.webkitRelativePath;


            link.appendChild(name);

            link.appendChild(path);

            fileList.appendChild(link);
        }
    }

</script>
